<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>神明幼稚園｜お問い合わせ・園見学のお申し込み</title>
<meta name="description" content="学校法人 神明の杜 神明幼稚園 採用サイトのお問い合わせ・園見学申込フォームです。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{--green:#4c8c4a;--green-dark:#35632f;--yellow:#f6c945;--cream:#fbf7ec;--ink:#2f2a24;--white:#fff;--radius:18px;--shadow:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 14px 38px rgba(0,0,0,.16)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:var(--cream);line-height:1.75;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.site-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:rgba(251,247,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:8px}.brand-logo{width:auto;height:30px}.brand-name{font-family:"Kiwi Maru",serif;font-size:18px;font-weight:500}
.header-cta{background:var(--green);color:var(--white);text-decoration:none;padding:8px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 4px 12px rgba(76,140,74,.3)}
.section{padding:48px 22px}.section.highlight{background:var(--white)}
.section-title{font-family:"Kiwi Maru",serif;font-size:23px;margin-bottom:18px;position:relative;padding-left:16px}
.section-title::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:6px;border-radius:999px;background:var(--yellow)}
.section-text{font-size:15px}.section-text.small{font-size:13px;color:#6b6459;margin-top:12px}
.section-text+.section-text{margin-top:12px}
.section-cta{display:inline-block;margin-top:22px;background:var(--green);color:var(--white);text-decoration:none;padding:13px 26px;border-radius:999px;font-weight:700;box-shadow:0 6px 16px rgba(76,140,74,.28)}
.hero-cta{display:inline-block;background:var(--yellow);color:var(--ink);text-decoration:none;padding:15px 32px;border-radius:999px;font-weight:700;box-shadow:var(--shadow-lg)}
.hero-cta.wide{display:block;text-align:center;margin:6px 0 18px}
.mail-link{display:block;margin-top:4px;color:var(--green-dark);font-weight:700;word-break:break-all;text-decoration:none}
.note{font-size:12px;color:#6b6459}
.site-footer{background:var(--green-dark);color:var(--white);padding:30px 20px 44px;text-align:center;font-size:13px}
.footer-logo{height:36px;width:auto;margin:0 auto 12px;display:block}.footer-small{font-size:12px;opacity:.85;margin-top:6px}.footer-small a{color:var(--yellow)}
@media (min-width:600px){main,.site-header{max-width:640px;margin-left:auto;margin-right:auto}}
.fade-in{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}.fade-in.visible{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.fade-in{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
.contact-form{display:grid;gap:18px;margin-top:24px}
.contact-form>label{display:block;font-size:14px;font-weight:700}
.contact-form input,.contact-form textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1px solid rgba(0,0,0,.15);border-radius:12px;background:var(--white);font:inherit;font-size:15px}
.contact-form input:focus,.contact-form textarea:focus{outline:2px solid var(--green);border-color:var(--green)}
.contact-form textarea{resize:vertical}
.req{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#b3541e;color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.form-note{display:block;font-size:12px;color:#6b6459;font-weight:400;margin-top:4px}
.purpose-group{border:0;padding:0}
.purpose-group legend{font-size:14px;font-weight:700;padding:0}
.purpose-group label{display:flex;align-items:center;gap:10px;font-weight:400;font-size:14px;background:var(--white);border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:11px 14px;margin-top:8px;cursor:pointer}
.purpose-group input{width:18px;height:18px;margin:0;accent-color:var(--green)}
.form-submit{display:block;width:100%;margin-top:4px;background:var(--green);color:var(--white);border:0;padding:15px 32px;border-radius:999px;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(76,140,74,.28)}
</style>
</head>
<body>
<header class="site-header">
<div class="brand">
<img src="https://www.shinmei-asobi.com/wp-content/uploads/2023/04/shinmei_logo2.png" alt="神明幼稚園ロゴ" class="brand-logo" />
</div>
<a href="index.html" class="header-cta">トップに戻る</a>
</header>
<main>
<section class="section" id="contact-form">
<h2 class="section-title">お問い合わせ・園見学のお申し込み</h2>
<p class="section-text">下記フォームにご記入のうえ、送信してください。</p>
<!-- ※本番では制作会社様が送信先を設定してください（Formspree / Googleフォーム連携 / 自社サーバー等）。現状は見た目の素案です。 -->
<form class="contact-form" action="" method="post">
<label>お名前<span class="req">必須</span>
<input type="text" name="name" required autocomplete="name" placeholder="例：神明 花子" />
</label>
<label>学校名・学年
<input type="text" name="school" placeholder="例：○○大学 3年／既卒 など" />
<span class="form-note">※新卒・既卒どちらの方もご記入いただけます</span>
</label>
<label>メールアドレス<span class="req">必須</span>
<input type="email" name="email" required autocomplete="email" placeholder="example@mail.com" />
</label>
<label>電話番号
<input type="tel" name="tel" autocomplete="tel" placeholder="例：090-1234-5678" />
</label>
<fieldset class="purpose-group">
<legend>ご用件</legend>
<label><input type="radio" name="purpose" value="園見学を希望" />園見学を希望</label>
<label><input type="radio" name="purpose" value="求人票がほしい" />求人票がほしい</label>
<label><input type="radio" name="purpose" value="その他" />その他</label>
</fieldset>
<label>ご希望の見学日
<input type="text" name="visit_date" placeholder="例：8月27日 10:00頃" />
<span class="form-note">※令和8年8月26日以降</span>
</label>
<label>ご質問・メッセージ
<textarea name="message" rows="5" placeholder="ご質問やご要望があればご記入ください"></textarea>
</label>
<button type="submit" class="form-submit">この内容で送信する</button>
</form>
</section>
<section class="section highlight">
<p class="section-text">フォームがご利用いただけない場合は、下記までメールでご連絡ください。</p>
<a href="mailto:office@shinmei-asobi.com" class="mail-link">office@shinmei-asobi.com</a>
</section>
</main>
<footer class="site-footer">
<img src="https://www.shinmei-asobi.com/wp-content/uploads/2023/04/shinmei_logo_wh2.png" alt="" class="footer-logo" />
<p>学校法人 神明の杜　神明幼稚園</p>
<p class="footer-small">〒135-0004 東京都江東区森下1-3-17　TEL 03-3632-8793</p>
<p class="footer-small"><a href="https://www.shinmei-asobi.com/" target="_blank" rel="noopener">園公式サイト</a></p>
</footer>
<script>
document.querySelectorAll("main .section").forEach(function(el){el.classList.add("fade-in");});
var ob=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("visible");ob.unobserve(e.target);}});},{threshold:0.12});
document.querySelectorAll(".fade-in").forEach(function(el){ob.observe(el);});
</script>
</body>
</html>
